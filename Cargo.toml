[package]
name = "sc2-map-finder"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }
flate2 = "1.1.11"
sys-locale = "0.3.2"

[profile.release]
opt-level = 3
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
