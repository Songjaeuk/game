name: 윈도우 실행파일 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 빌드
        run: cargo build --release
      - name: 실행파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: sc2-map-finder
          path: target/release/sc2-map-finder.exe
